allowBuilds:
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
# sharp dipaksa ke versi patch aman (>=0.35.4, libheif GHSA-rgj7-g3m4-5g8c).
# Hanya dipakai miniflare dev-emulation via wrangler; patch-level, API stabil.
overrides:
  sharp@<0.35.4: 0.35.4
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  '@humanfs/node@<0.16.8': 0.16.8
  browserslist@<=4.28.6: 4.28.7
  cookie@<0.7.0: 0.7.2
  # fast-uri dinaikkan ke 3.1.8 (GHSA-qw65-cvwx-89v3 + GHSA-58mr-gqgx-xq4g, gate audit CI).
  fast-uri@<3.1.8: 3.1.8
  # undici dinaikkan ke 7.29.1 (GHSA-rfgv-xxqx-mfg5 + GHSA-w293-vg96-wgc3, gate audit CI).
  undici@<7.29.1: 7.29.1
  # brace-expansion dinaikkan (GHSA-qhr7-859c-m2p7 + GHSA-6j4f-fj2g-mc7p, gate audit CI).
  brace-expansion@>=2.0.0 <2.1.6: 2.1.6
  brace-expansion@>=4.0.0 <5.0.11: 5.0.11
  postcss-selector-parser@<7.1.3: 7.1.3
  serialize-javascript@<7.0.5: 7.0.5
  # devalue dinaikkan ke 5.9.4 (GHSA-j22f-vq7h-c4qm + GHSA-mcm9-63f2-9j32 +
  # GHSA-x5rw-q4pp-hg5g, gate audit CI). Tetap lini v5 sesuai svelte 5.
  devalue@<5.9.3: 5.9.4
