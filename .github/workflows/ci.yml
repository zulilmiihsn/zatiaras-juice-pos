name: CI

on:
  push:
    branches: [main, 'codex/**', 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm check

      - name: ESLint Check
        run: pnpm exec eslint .

      - name: Format Check
        run: pnpm format:check

      - name: Dependency Audit (high+)
        run: pnpm audit --audit-level high

  operations:
    name: Operations Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Operations Suites
        run: pnpm test:operations

      - name: Upload Operations Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: operations-logs-${{ github.sha }}
          path: |
            **/*.log
            code-quality-report.md
          retention-days: 7
          if-no-files-found: ignore

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static, operations]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Hardening Suite
        run: pnpm test:hardening

      - name: Run Stores Suite
        run: pnpm test:stores

      - name: Run Offline Suite
        run: pnpm test:offline

      - name: Run POS Integrity Suite
        run: pnpm test:pos-integrity

      - name: Run Ingredient Yield Suite
        run: pnpm test:ingredient-yield

      - name: Run Quantity Decimal Suite
        run: pnpm test:quantity-decimal

      - name: Run Receipt Output Suite
        run: pnpm test:receipt-output

      - name: Run Report Grouping Suite
        run: pnpm test:report-grouping

      - name: Run Report Tax Suite
        run: pnpm test:report-tax

      - name: Run Report Tax Workerd Suite
        run: pnpm exec tsx src/tests/report-tax-tests.ts --d1

      - name: Run Service Pure Suite
        run: pnpm test:service-pure

      - name: Run AI Period Suite
        run: pnpm test:ai-period

      - name: Run AI Gateway Suite
        run: pnpm test:ai-gateway

      - name: Run AI Chat Usecase Suite
        run: pnpm test:ai-chat-usecase

      - name: Run Tax Suite
        run: pnpm test:tax

      - name: Run Tax CAS Suite
        run: pnpm test:tax-cas

      - name: Run Tax Save Chain Suite
        run: pnpm test:tax-save-chain

      - name: Run Archive Restore Suite
        run: pnpm test:archive-restore

      - name: Run Archive Usecase Suite
        run: pnpm test:archive-usecase

      - name: Run Archive Guard Suite
        run: pnpm test:archive-guard

      - name: Run Restore Apply Suite
        run: pnpm test:restore-apply

      - name: Run Restore Chunk Suite
        run: pnpm test:restore-chunk

      - name: Run Restore Chunk Workerd Suite
        run: pnpm exec tsx src/tests/restore-chunk-tests.ts --d1

      - name: Run Menu Atomic Suite
        run: pnpm test:menu-atomic

      - name: Run External Branch Seed Validation Suite
        run: pnpm test:seed-external-branches

      - name: Run Tenant Scope Suite
        run: pnpm test:tenant-scope

      - name: Run Data Health Suite
        run: pnpm test:data-health

      - name: Run Realtime Suite
        run: pnpm test:realtime

      - name: Run Post-Commit Suite
        run: pnpm test:post-commit

      - name: Run Post-Commit Workerd Suite
        run: pnpm exec tsx src/tests/post-commit-tests.ts --d1

      - name: Run Retention Suite
        run: pnpm test:retention

      - name: Run Retention Workerd Suite
        run: pnpm exec tsx src/tests/retention-tests.ts --d1

      - name: Run Stock Policy Suites
        run: |
          pnpm test:stock-policy
          pnpm test:stock-health
          pnpm test:stock-reconciliation
          pnpm test:stock-offline-review
          pnpm test:stock-write-guards

      - name: Run Antrean Suite
        run: pnpm test:antrean

      - name: Run Antrean Notification Suite
        run: pnpm test:antrean-notifications

      - name: Run Antrean Notification Workerd Suite
        run: pnpm test:antrean-notifications --d1

      - name: Run Migration Matrix Suite
        run: pnpm test:migration-matrix

      - name: Run A11y Suite
        run: pnpm test:a11y

      - name: Run Maintainability Guard Suite
        run: pnpm test:maintainability

      - name: Run Error Code Contract Suite
        run: pnpm test:error-codes

      - name: Run Docs Drift Suite
        run: pnpm test:docs-drift

      - name: Run Ledger Validation Suite
        run: pnpm test:ledger-validation

      - name: Run Purchase Command Suite
        run: pnpm test:purchase-command

      - name: Run Purchase Command Workerd Suite
        run: pnpm test:purchase-command --d1

      - name: Run Sesi Toko Suite
        run: pnpm test:sesi-toko

      - name: Run Sesi Toko Workerd Suite
        run: pnpm exec tsx src/tests/sesi-toko-tests.ts --d1

      - name: Run Credential Username Suite
        run: pnpm test:credential-username

      - name: Run Credential Username Workerd Suite
        run: pnpm exec tsx src/tests/credential-username-tests.ts --d1

      - name: Run Telemetry Scope Suite
        run: pnpm test:telemetry-scope

      - name: Run Telemetry Scope Workerd Suite
        run: pnpm exec tsx src/tests/telemetry-scope-tests.ts --d1

      - name: Run Diagnostic Scope Suite
        run: pnpm test:diagnostic-scope

      - name: Run Role Contract Suite
        run: pnpm test:role-contract

      - name: Run Catat Timezone Suite
        run: pnpm test:catat-timezone

      - name: Run Branch Label Suite
        run: pnpm test:branch-label

      - name: Run AI Report Suite
        run: pnpm test:ai-report

      - name: Run Ledger Category Suite
        run: pnpm test:ledger-category

      - name: Run AI Recommendation Schema Suite
        run: pnpm test:ai-recommendation-schema

      - name: Run HPP Parse Usecase Suite
        run: pnpm test:hpp-parse-usecase

      - name: Run Archive Version Suite
        run: pnpm test:archive-version

      - name: Run Archive Chunk Suite
        run: pnpm test:archive-chunk

      - name: Run Archive Download Suite
        run: pnpm test:archive-download

      - name: Run Archive Download Workerd Suite
        run: pnpm exec tsx src/tests/archive-download-tests.ts --d1

      - name: Upload Unit Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-logs-${{ github.sha }}
          path: |
            **/*.log
            code-quality-report.md
          retention-days: 7
          if-no-files-found: ignore

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Suites
        run: pnpm test:quality

      - name: Upload Quality Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-report-${{ github.sha }}
          path: code-quality-report.md
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [static, operations]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Full E2E Suite A (36 tests, isolated server+DB)
        run: pnpm test:e2e:ci-a

      - name: Run Full E2E Suite B (36 tests, isolated server+DB)
        run: pnpm test:e2e:ci-b

      - name: Run Full E2E Suite C (35 tests, isolated server+DB)
        run: pnpm test:e2e:ci-c

      - name: Verify No Project State Touched
        run: |
          test ! -d .wrangler || (echo 'E2E created .wrangler in repo' && exit 1)
          test -z "$(git status --porcelain)" || (git status --short && exit 1)

      - name: Upload E2E Report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Application Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [static, operations, unit, quality, e2e]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application Bundle
        run: pnpm build

      - name: Record Release Manifest
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: pnpm deploy:manifest

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ github.sha }}
          path: |
            .svelte-kit/cloudflare
            .svelte-kit/cloudflare-tmp
            .svelte-kit/output/server
            build-artifacts.json
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
