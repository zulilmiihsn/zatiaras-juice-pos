name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-char commit SHA rilis (harus hijau di CI)
        required: true
      dry_run:
        description: 'true = hanya verifikasi manifest, false = deploy betulan'
        required: true
        default: 'true'
      ci_run_id:
        description: ID angka CI run hijau pemilik artifact (lihat URL run CI)
        required: true

jobs:
  verify:
    name: Verify Release Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Download Release Artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ inputs.sha }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Verify Artifact Provenance
        env:
          RELEASE_COMMIT_SHA: ${{ inputs.sha }}
        run: node scripts/preflight-release.mjs --verify-only

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]
    if: inputs.dry_run == 'false'
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Release Artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ inputs.sha }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Verify Artifact Provenance
        env:
          RELEASE_COMMIT_SHA: ${{ inputs.sha }}
        run: node scripts/preflight-release.mjs --verify-only

      - name: Deploy Realtime Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:realtime

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:pages
