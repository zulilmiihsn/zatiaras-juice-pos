name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-char commit SHA rilis (harus hijau di CI)
        required: true
      dry_run:
        description: 'true = hanya verifikasi manifest, false = deploy betulan'
        required: true
        default: 'true'
      ci_run_id:
        description: ID angka CI run hijau pemilik artifact (lihat URL run CI)
        required: true
      target:
        description: Lingkungan tujuan (staging dipakai untuk uji sebelum produksi)
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
          - branch-account-staging
      staging_ref:
        description: Ref staging (main atau release/*; diabaikan untuk produksi)
        required: false
        default: main
      branch_smoke:
        description: Uji isolasi branch-account-staging tanpa deploy ulang
        type: boolean
        default: false
      branch_restore:
        description: Uji backup dan restore branch-account-staging ke D1 sementara
        type: boolean
        default: false
      branch_r2_check:
        description: Periksa akses R2 staging (baca saja, tanpa deploy atau billing)
        type: boolean
        default: false
      branch_r2_prepare:
        description: Siapkan bucket Standard kosong untuk R2 staging di Samarinda
        type: boolean
        default: false
      branch_r2_smoke:
        description: Uji gambar dan arsip sintetis pada R2 bersama staging
        type: boolean
        default: false
      branch_maintenance_check:
        description: Verifikasi eksekusi maintenance lewat log staging (baca saja)
        type: boolean
        default: false
      branch_schema_check:
        description: Bandingkan tabel dan skema tiga D1 staging (baca saja)
        type: boolean
        default: false
      branch_production_d1_prepare:
        description: Buat hanya tiga D1 tujuan produksi kosong, tanpa deploy atau migrasi
        type: boolean
        default: false
      branch_production_d1_check:
        description: Verifikasi tiga D1 tujuan masih kosong tanpa membuat atau mengubah D1
        type: boolean
        default: false
      branch_production_candidate:
        description: Deploy kandidat produksi tertutup tanpa mengubah rute aktif
        type: boolean
        default: false
      branch_production_pages_paused:
        description: Pasang gateway baru pada URL produksi dan verifikasi rute tanpa membuka kasir
        type: boolean
        default: false
      branch_public_open_ack:
        description: Isi ACTIVATION_STOCK_CUTOFF_CONFIRMED setelah ketiga aktivasi dan cutoff terverifikasi
        type: string
        default: ''
      branch_activation_ack:
        description: Isi STOCK_AND_CUTOFF_CONFIRMED hanya setelah operator mengonfirmasi stok dan cutoff POS sementara
        type: string
        default: ''
      branch_production_operational_prep:
        description: Siapkan koordinator dan katalog ketiga backend tanpa membuka atau mengaktifkan penjualan
        type: boolean
        default: false
      branch_production_connect_paused:
        description: Hubungkan backend tertutup ke D1 hasil impor dan R2, tanpa mengubah Pages
        type: boolean
        default: false
      branch_production_storage_writes:
        description: Aktifkan dan uji tulis relay R2 sementara gateway kasir tetap terkunci
        type: boolean
        default: false
      branch_production_storage_readonly:
        description: Pasang dan verifikasi relay R2 produksi read-only tanpa mengubah URL kasir
        type: boolean
        default: false
      branch_cutover_preflight:
        description: Periksa produksi baca-saja dan jalankan smoke staging lewat Pages terisolasi
        type: boolean
        default: false
      branch_route_drill:
        description: Latihan pindah dan rollback rute pada Worker sintetis sementara
        type: boolean
        default: false

env:
  RELEASE_COMMIT_SHA: ${{ inputs.sha }}
  RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}
  RELEASE_SOURCE_REF: ${{ inputs.target != 'production' && inputs.staging_ref || 'main' }}

jobs:
  verify:
    name: Verify Release Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate Release Inputs
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          BRANCH_SMOKE: ${{ inputs.branch_smoke }}
          BRANCH_RESTORE: ${{ inputs.branch_restore }}
          BRANCH_R2_CHECK: ${{ inputs.branch_r2_check }}
          BRANCH_R2_PREPARE: ${{ inputs.branch_r2_prepare }}
          BRANCH_R2_SMOKE: ${{ inputs.branch_r2_smoke }}
          BRANCH_MAINTENANCE_CHECK: ${{ inputs.branch_maintenance_check }}
          BRANCH_SCHEMA_CHECK: ${{ inputs.branch_schema_check }}
          BRANCH_PRODUCTION_D1_PREPARE: ${{ inputs.branch_production_d1_prepare }}
          BRANCH_PRODUCTION_D1_CHECK: ${{ inputs.branch_production_d1_check }}
          BRANCH_PRODUCTION_CANDIDATE: ${{ inputs.branch_production_candidate }}
          BRANCH_PRODUCTION_CONNECT_PAUSED: ${{ inputs.branch_production_connect_paused }}
          BRANCH_PRODUCTION_OPERATIONAL_PREP: ${{ inputs.branch_production_operational_prep }}
          BRANCH_ACTIVATION_ACK: ${{ inputs.branch_activation_ack }}
          BRANCH_PUBLIC_OPEN_ACK: ${{ inputs.branch_public_open_ack }}
          BRANCH_PRODUCTION_PAGES_PAUSED: ${{ inputs.branch_production_pages_paused }}
          BRANCH_PRODUCTION_STORAGE_READONLY: ${{ inputs.branch_production_storage_readonly }}
          BRANCH_PRODUCTION_STORAGE_WRITES: ${{ inputs.branch_production_storage_writes }}
          BRANCH_CUTOVER_PREFLIGHT: ${{ inputs.branch_cutover_preflight }}
          BRANCH_ROUTE_DRILL: ${{ inputs.branch_route_drill }}
        run: |
          branch_modes=0
          for mode in "$BRANCH_SMOKE" "$BRANCH_RESTORE" "$BRANCH_R2_CHECK" "$BRANCH_R2_PREPARE" "$BRANCH_R2_SMOKE" "$BRANCH_MAINTENANCE_CHECK" "$BRANCH_SCHEMA_CHECK" "$BRANCH_PRODUCTION_D1_PREPARE" "$BRANCH_PRODUCTION_D1_CHECK" "$BRANCH_PRODUCTION_CANDIDATE" "$BRANCH_PRODUCTION_CONNECT_PAUSED" "$BRANCH_PRODUCTION_OPERATIONAL_PREP" "$BRANCH_PRODUCTION_PAGES_PAUSED" "$BRANCH_PRODUCTION_STORAGE_READONLY" "$BRANCH_PRODUCTION_STORAGE_WRITES" "$BRANCH_CUTOVER_PREFLIGHT" "$BRANCH_ROUTE_DRILL"; do
            if [[ "$mode" == true ]]; then branch_modes=$((branch_modes + 1)); fi
          done
          if [[ -n "$BRANCH_ACTIVATION_ACK" ]]; then
            [[ "$BRANCH_ACTIVATION_ACK" == STOCK_AND_CUTOFF_CONFIRMED ]] || exit 1
            branch_modes=$((branch_modes + 1))
          fi
          if [[ -n "$BRANCH_PUBLIC_OPEN_ACK" ]]; then
            [[ "$BRANCH_PUBLIC_OPEN_ACK" == ACTIVATION_STOCK_CUTOFF_CONFIRMED ]] || exit 1
            branch_modes=$((branch_modes + 1))
          fi
          if (( branch_modes > 1 )); then exit 1; fi
          if (( branch_modes == 1 )); then
            [[ "$RELEASE_TARGET" == branch-account-staging && "$RELEASE_SOURCE_REF" == release/branch-account-staging && "$GITHUB_REF" == refs/heads/release/branch-account-staging ]] || exit 1
          fi
          [[ "$RELEASE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Invalid release SHA" && exit 1)
          [[ "$RELEASE_CI_RUN_ID" =~ ^[0-9]+$ ]] || (echo "Invalid CI run ID" && exit 1)
          case "$RELEASE_TARGET" in
            production|staging|branch-account-staging) ;;
            *) echo "Invalid deployment target"; exit 1 ;;
          esac
          case "$RELEASE_SOURCE_REF" in
            main|release/?*) ;;
            *) echo "Release ref must be main or release/*"; exit 1 ;;
          esac
          git check-ref-format --branch "$RELEASE_SOURCE_REF"

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # Jangan ref langsung ke SHA: perilaku fetch-SHA actions/checkout
          # rapuh (pernah gagal sebagai branch). Checkout main untuk produksi
          # atau ref staging terpilih, lalu buktikan HEAD = SHA rilis;
          # manifest verify mengunci sisanya.
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Assert Release SHA
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_SHA" || (echo "SHA mismatch" && exit 1)

      - name: Verify Successful CI Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_CI_RUN_ID" --jq '[.head_sha, .conclusion, .path] | @tsv')"
          IFS=$'\t' read -r ci_sha ci_conclusion ci_path <<< "$ci_metadata"
          test "$ci_sha" = "$RELEASE_COMMIT_SHA" || (echo "CI SHA mismatch" && exit 1)
          test "$ci_conclusion" = "success" || (echo "CI run must be successful" && exit 1)
          test "$ci_path" = ".github/workflows/ci.yml" || (echo "Artifact must come from CI workflow" && exit 1)

      - name: Download Release Artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ inputs.sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Artifact Provenance
        run: node scripts/preflight-release.mjs --verify-only

  deploy:
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]
    if: inputs.dry_run == 'false'
    environment: ${{ inputs.target }}
    concurrency:
      group: deploy-${{ inputs.target }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Assert Release SHA
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_SHA" || (echo "SHA mismatch" && exit 1)

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Release Artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ inputs.sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Artifact Provenance
        run: node scripts/preflight-release.mjs --verify-only

      - name: Deploy isolated branch account staging
        if: inputs.target == 'branch-account-staging' && !inputs.branch_smoke && !inputs.branch_restore && !inputs.branch_r2_check && !inputs.branch_r2_prepare && !inputs.branch_r2_smoke && !inputs.branch_maintenance_check && !inputs.branch_schema_check && !inputs.branch_production_d1_prepare && !inputs.branch_production_d1_check && !inputs.branch_production_candidate && !inputs.branch_production_connect_paused && !inputs.branch_production_operational_prep && inputs.branch_activation_ack == '' && inputs.branch_public_open_ack == '' && !inputs.branch_production_pages_paused && !inputs.branch_production_storage_readonly && !inputs.branch_production_storage_writes && !inputs.branch_cutover_preflight && !inputs.branch_route_drill
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_STAGING_KEY: ${{ secrets.BRANCH_STAGING_KEY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: node scripts/deploy-branch-account-staging.mjs

      - name: Smoke test isolated branch account staging
        if: inputs.target == 'branch-account-staging' && inputs.branch_smoke
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: node scripts/smoke-branch-account-staging.mjs

      - name: Recover Berau staging if smoke was interrupted
        if: always() && inputs.target == 'branch-account-staging' && inputs.branch_smoke
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: node scripts/smoke-branch-account-staging.mjs --restore

      - name: Drill backup and restore on temporary staging D1
        if: inputs.target == 'branch-account-staging' && inputs.branch_restore
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: node scripts/drill-branch-account-staging.mjs

      - name: Check existing R2 access without changes
        if: inputs.target == 'branch-account-staging' && inputs.branch_r2_check
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: node scripts/check-branch-account-r2.mjs

      - name: Prepare shared staging R2 bucket
        if: inputs.target == 'branch-account-staging' && inputs.branch_r2_prepare
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
        run: node scripts/check-branch-account-r2.mjs --prepare

      - name: Test shared R2 through live staging application
        if: inputs.target == 'branch-account-staging' && inputs.branch_r2_smoke
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_STAGING_KEY: ${{ secrets.BRANCH_STAGING_KEY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: node scripts/smoke-shared-r2-staging.mjs

      - name: Verify live branch maintenance execution
        if: inputs.target == 'branch-account-staging' && inputs.branch_maintenance_check
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: node scripts/check-branch-maintenance-staging.mjs

      - name: Compare live D1 staging schemas
        if: inputs.target == 'branch-account-staging' && inputs.branch_schema_check
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: node scripts/check-branch-d1-schema-staging.mjs

      - name: Prepare or verify empty branch production D1 destinations (no traffic)
        if: inputs.target == 'branch-account-staging' && (inputs.branch_production_d1_prepare || inputs.branch_production_d1_check || inputs.branch_cutover_preflight)
        env:
          BRANCH_PRODUCTION_D1_CHECK: ${{ inputs.branch_production_d1_check || inputs.branch_cutover_preflight }}
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: |
          if [[ "$BRANCH_PRODUCTION_D1_CHECK" == true ]]; then
            node scripts/prepare-branch-production-d1.mjs --check-only
          else
            node scripts/prepare-branch-production-d1.mjs
          fi

      - name: Drill live branch route cutover on temporary Workers
        if: inputs.target == 'branch-account-staging' && inputs.branch_route_drill
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
        run: node scripts/drill-branch-route-staging.mjs

      - name: Deploy production backends while the public origin remains closed
        if: inputs.target == 'branch-account-staging' && (inputs.branch_production_candidate || inputs.branch_production_connect_paused || inputs.branch_production_operational_prep || inputs.branch_activation_ack != '' || inputs.branch_public_open_ack != '')
        env:
          CONNECT_PAUSED: ${{ inputs.branch_production_connect_paused }}
          PREPARE_OPERATIONAL: ${{ inputs.branch_production_operational_prep }}
          BRANCH_ACTIVATION_ACK: ${{ inputs.branch_activation_ack }}
          BRANCH_PUBLIC_OPEN_ACK: ${{ inputs.branch_public_open_ack }}
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_PRODUCTION_PREP_KEY: ${{ secrets.BRANCH_PRODUCTION_PREP_KEY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: |
          args=()
          if [[ "$CONNECT_PAUSED" == true ]]; then args+=(--connect-paused); fi
          if [[ "$PREPARE_OPERATIONAL" == true ]]; then args+=(--prepare-operational); fi
          if [[ "$BRANCH_ACTIVATION_ACK" == STOCK_AND_CUTOFF_CONFIRMED ]]; then args+=(--activate-closed); fi
          if [[ "$BRANCH_PUBLIC_OPEN_ACK" == ACTIVATION_STOCK_CUTOFF_CONFIRMED ]]; then args+=(--serve-operational); fi
          node scripts/deploy-branch-production-candidate.mjs "${args[@]}"

      - name: Deploy the production Pages gateway after backend verification
        if: inputs.target == 'branch-account-staging' && (inputs.branch_production_pages_paused || inputs.branch_public_open_ack != '')
        env:
          BRANCH_PUBLIC_OPEN_ACK: ${{ inputs.branch_public_open_ack }}
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_PRODUCTION_PREP_KEY: ${{ secrets.BRANCH_PRODUCTION_PREP_KEY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
          BRANCH_CF_TOKEN_BALIKPAPAN: ${{ secrets.BRANCH_CF_TOKEN_BALIKPAPAN }}
          BRANCH_CF_TOKEN_BERAU: ${{ secrets.BRANCH_CF_TOKEN_BERAU }}
        run: |
          args=()
          if [[ "$BRANCH_PUBLIC_OPEN_ACK" == ACTIVATION_STOCK_CUTOFF_CONFIRMED ]]; then args+=(--open-public); fi
          node scripts/deploy-production-branch-pages.mjs "${args[@]}"

      - name: Read production source and rollback reference only
        if: ${{ !cancelled() && inputs.target == 'branch-account-staging' && inputs.branch_cutover_preflight }}
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
        run: node scripts/check-production-cutover-preflight.mjs

      - name: Deploy and verify the production R2 relay while cashier is closed
        if: inputs.target == 'branch-account-staging' && (inputs.branch_production_storage_readonly || inputs.branch_production_storage_writes)
        env:
          ENABLE_WRITES: ${{ inputs.branch_production_storage_writes }}
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_PRODUCTION_PREP_KEY: ${{ secrets.BRANCH_PRODUCTION_PREP_KEY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
        run: |
          args=()
          if [[ "$ENABLE_WRITES" == true ]]; then args+=(--enable-writes); fi
          node scripts/deploy-production-storage.mjs "${args[@]}"

      - name: Run staging smoke through an isolated Pages hostname
        if: ${{ !cancelled() && inputs.target == 'branch-account-staging' && inputs.branch_cutover_preflight }}
        env:
          BRANCH_STAGING_INVENTORY: ${{ vars.BRANCH_STAGING_INVENTORY }}
          BRANCH_CF_TOKEN_SAMARINDA: ${{ secrets.BRANCH_CF_TOKEN_SAMARINDA }}
        run: node scripts/drill-pages-gateway-preview.mjs

      - name: Provision Antrean VAPID secrets
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          test -n "$VAPID_PUBLIC_KEY" -a -n "$VAPID_PRIVATE_KEY" -a -n "$VAPID_SUBJECT"
          node -e 'process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT}))' | pnpm exec wrangler secret bulk --config wrangler.realtime.jsonc
          node -e 'process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT}))' | pnpm exec wrangler pages secret bulk --project-name zatiaraspos

      - name: Deploy Realtime Worker
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:realtime

      - name: Deploy Pages
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:pages

      # Staging: resource berakhiran -staging (staging/*.jsonc); push opsional bila secret ada.
      - name: Provision staging VAPID secrets
        if: inputs.target == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_SUBJECT" ]; then
            echo "VAPID staging belum diatur; push dinonaktifkan di staging."
            exit 0
          fi
          node -e 'process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT}))' | pnpm exec wrangler secret bulk --config staging/wrangler.realtime.jsonc
          node -e 'process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT}))' | pnpm exec wrangler pages secret bulk --project-name zatiaraspos-staging

      - name: Deploy Staging Realtime Worker
        if: inputs.target == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:staging:realtime

      - name: Deploy Staging Pages
        if: inputs.target == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
