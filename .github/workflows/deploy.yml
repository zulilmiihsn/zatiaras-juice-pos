name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-char commit SHA rilis (harus hijau di CI)
        required: true
      dry_run:
        description: 'true = hanya verifikasi manifest, false = deploy betulan'
        required: true
        default: 'true'
      ci_run_id:
        description: ID angka CI run hijau pemilik artifact (lihat URL run CI)
        required: true
      target:
        description: Lingkungan tujuan (staging dipakai untuk uji sebelum produksi)
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      staging_ref:
        description: Ref staging (main atau release/*; diabaikan untuk produksi)
        required: false
        default: main

env:
  RELEASE_COMMIT_SHA: ${{ inputs.sha }}
  RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}
  RELEASE_SOURCE_REF: ${{ inputs.target == 'staging' && inputs.staging_ref || 'main' }}

jobs:
  verify:
    name: Verify Release Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate Release Inputs
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          [[ "$RELEASE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Invalid release SHA" && exit 1)
          [[ "$RELEASE_CI_RUN_ID" =~ ^[0-9]+$ ]] || (echo "Invalid CI run ID" && exit 1)
          case "$RELEASE_TARGET" in
            production|staging) ;;
            *) echo "Invalid deployment target"; exit 1 ;;
          esac
          case "$RELEASE_SOURCE_REF" in
            main|release/?*) ;;
            *) echo "Release ref must be main or release/*"; exit 1 ;;
          esac
          git check-ref-format --branch "$RELEASE_SOURCE_REF"

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # Jangan ref langsung ke SHA: perilaku fetch-SHA actions/checkout
          # rapuh (pernah gagal sebagai branch). Checkout main untuk produksi
          # atau ref staging terpilih, lalu buktikan HEAD = SHA rilis;
          # manifest verify mengunci sisanya.
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Assert Release SHA
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_SHA" || (echo "SHA mismatch" && exit 1)

      - name: Verify Successful CI Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_CI_RUN_ID" --jq '[.head_sha, .conclusion, .path] | @tsv')"
          IFS=$'\t' read -r ci_sha ci_conclusion ci_path <<< "$ci_metadata"
          test "$ci_sha" = "$RELEASE_COMMIT_SHA" || (echo "CI SHA mismatch" && exit 1)
          test "$ci_conclusion" = "success" || (echo "CI run must be successful" && exit 1)
          test "$ci_path" = ".github/workflows/ci.yml" || (echo "Artifact must come from CI workflow" && exit 1)

      - name: Download Release Artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ inputs.sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Artifact Provenance
        run: node scripts/preflight-release.mjs --verify-only

  deploy:
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]
    if: inputs.dry_run == 'false'
    environment: ${{ inputs.target }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Assert Release SHA
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_SHA" || (echo "SHA mismatch" && exit 1)

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Release Artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ inputs.sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Artifact Provenance
        run: node scripts/preflight-release.mjs --verify-only

      - name: Provision Antrean VAPID secrets
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          test -n "$VAPID_PUBLIC_KEY" -a -n "$VAPID_PRIVATE_KEY" -a -n "$VAPID_SUBJECT"
          node -e 'process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT}))' | pnpm exec wrangler secret bulk --config wrangler.realtime.jsonc
          node -e 'process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT}))' | pnpm exec wrangler pages secret bulk --project-name zatiaraspos

      - name: Deploy Realtime Worker
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:realtime

      - name: Deploy Pages
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:pages

      # Staging: resource berakhiran -staging (staging/*.jsonc); push opsional bila secret ada.
      - name: Provision staging VAPID secrets
        if: inputs.target == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_SUBJECT" ]; then
            echo "VAPID staging belum diatur; push dinonaktifkan di staging."
            exit 0
          fi
          node -e 'process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT}))' | pnpm exec wrangler secret bulk --config staging/wrangler.realtime.jsonc
          node -e 'process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:process.env.VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY:process.env.VAPID_PRIVATE_KEY,VAPID_SUBJECT:process.env.VAPID_SUBJECT}))' | pnpm exec wrangler pages secret bulk --project-name zatiaraspos-staging

      - name: Deploy Staging Realtime Worker
        if: inputs.target == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:staging:realtime

      - name: Deploy Staging Pages
        if: inputs.target == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:staging:pages
